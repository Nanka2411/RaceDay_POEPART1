
name: RaceDay Part 3 CI

on:
  push:
    branches:
      - main
      - master
      - POE-PART-3-FINAL
  pull_request:
    branches:
      - main
      - master
      - POE-PART-3-FINAL

jobs:
  build:
    name: Build RaceDay Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check .NET Version
        run: dotnet --version

      - name: Restore and Build Projects
        shell: bash
        run: |
          mapfile -t projects < <(find . -name "*.csproj" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*")

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No C# project files found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"

            echo "Building $project"
            dotnet build "$project" --no-restore --configuration Release
          done

      - name: Run Tests
        shell: bash
        run: |
          mapfile -t tests < <(find . -name "*Test*.csproj" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*")

          if [ ${#tests[@]} -eq 0 ]; then
            echo "No test projects found. Skipping tests."
          else
            for project in "${tests[@]}"; do
              dotnet test "$project" --configuration Release
            done
          fi

      - name: CI Completed
        run: echo "RaceDay Part 3 CI completed successfully!"
