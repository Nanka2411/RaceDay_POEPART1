name: Validate Race_Day Repository

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📁 Check docs Folder
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ docs folder is missing."
            exit 1
          fi

          echo "✅ docs folder exists."

      - name: 📋 Check API Endpoint Plan
        run: |
          if [ ! -f "docs/API_Endpoint_Plan.pdf" ]; then
            echo "❌ API_Endpoint_Plan.pdf is missing."
            exit 1
          fi

          echo "✅ API_Endpoint_Plan.pdf exists."

      - name: 🔗 Check ERD Diagram
        run: |
          if [ ! -f "docs/ERDDIAGRAM.drawio.png" ]; then
            echo "❌ ERDDIAGRAM.drawio.png is missing."
            exit 1
          fi

          echo "✅ ERDDIAGRAM.drawio.png exists."

      - name: 🏁 Check Race Day Documentation
        run: |
          if [ ! -f "docs/RACE_DAY PROG_POE1.png" ]; then
            echo "❌ RACE_DAY PROG_POE1.png is missing."
            exit 1
          fi

          echo "✅ RACE_DAY PROG_POE1.png exists."

      - name: 🎉 Validation Complete
        run: |
          echo "=================================="
          echo "✅ Race_Day repository validated!"
          echo "✅ All required documentation exists."
          echo "=================================="
