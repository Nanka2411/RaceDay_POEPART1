name: Check Documentation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ docs folder is missing!"
            exit 1
          fi

          echo "✅ docs folder exists!"

      - name: Check required files
        run: |
          test -f "docs/API_Endpoint_Plan.pdf"
          test -f "docs/ERDDIAGRAM.drawio.png"
          test -f "docs/RACE_DAY PROG_POE1.png"

          echo "✅ All required documentation files found!"

      - name: Validation successful
        run: |
          echo "🎉 Race Day documentation validation passed!"
    
