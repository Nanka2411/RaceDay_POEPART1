name: Validate Repository Structure

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ ERROR: docs folder does not exist."
            exit 1
          fi

          echo "✅ docs folder exists."

      - name: Check required files
        run: |
          required_files=(
            "docs/ERD.png"
            "docs/API-Endpoints.png"
            "docs/Database-Script.sql"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Required file $file is missing."
              exit 1
            fi
          done

          echo "✅ All required documentation files exist."
