
name: RaceDay Part 3 CI

on:
  push:
    branches:
      - main
      - master
      - POE-PART-3-FINAL
  pull_request:
    branches:
      - main
      - master
      - POE-PART-3-FINAL

jobs:
  build:
    name: Build RaceDay Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Repository Files
        run: |
          echo "Files and folders in repository:"
          ls -la
          echo "Searching for project and solution files:"
          find . -type f \( -name "*.csproj" -o -name "*.sln" -o -name "*.slnx" \)

      - name: Check C# Project Files
        run: |
          if ! find . -type f -name "*.csproj" | grep -q .; then
            echo "No .csproj files found. Check that your C# project files are committed to GitHub."
            exit 1
          fi
          echo "C# project files found."
