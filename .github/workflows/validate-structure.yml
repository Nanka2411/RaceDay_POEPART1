name: Validate Repository Structure

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation files
        shell: bash
        run: |
          files=(
            "API_Endpoint_Plan.pdf"
            "ERDDIAGRAM.drawio.png"
            "RACE_DAY PROG_POE1.sql"
            "README.md"
          )

          missing=0

          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing: $file"
              missing=1
            else
              echo "✅ Found: $file"
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "❌ Required files are missing."
            exit 1
          fi

          echo "✅ All required files found!"

      - name: Validation successful
        run: echo "🎉 Repository structure validation passed!"
         
